<mat-form-field 
    [ngClass]="field.eventTrigger === 'press' ? 'readOnlyPressable': ''"
    [ngClass]="(field.readonly === true)? 'readOnly': 'notReadOnly'" 
    (click)="onPress()"
    *ngIf="field.isVisible != false && field.inputType !== 'date' && field.inputType !== 'datetime' && field.inputType !== 'time'"
    [ngStyle]="{'width': '100%'}" 
    appearance="outline" 
    [formGroup]="group">
    <mat-label>{{field.label}}</mat-label>
    <span *ngIf="field.prefix" matPrefix>{{field.prefix}}</span>
    <input [required]="isRequired" matInput [value]="field.value" [formControlName]="field.name"
        [placeholder]="field.label" [type]="field.inputType" [readonly]="field.readonly || readOnlyPage"
        (blur)="onBlur()" (focus)="onFocus()" (change)="updateValue()" [style.padding]="'4px'"
        [style.border-radius]="'4px'" [style.background-color]="field.style.background_color"
        [style.text-decoration]="field.style.text_decoration" [style.color]="field.style.font_color">
    <span *ngIf="field.suffix" matSuffix>{{field.suffix}}</span>
    <ng-container *ngFor="let validation of field.validations;" ngProjectAs="mat-error">
        <mat-error *ngIf="group.get(field.name).hasError(validation.name)">{{validation.message}}</mat-error>
    </ng-container>
</mat-form-field>

<mat-form-field [ngClass]="field.eventTrigger === 'press' ? 'readOnlyPressable': ''"
    [ngClass]="(field.readonly === true)? 'readOnly': 'notReadOnly'" (click)="onPress()"
    *ngIf="field.isVisible != false && field.inputType === 'date'" [ngStyle]="{'width': '100%'}" appearance="outline"
    [formGroup]="group">
    <mat-label>{{field.label}}</mat-label>
    <span *ngIf="field.prefix" matPrefix>{{field.prefix}}</span>

    <input [required]="isRequired" matInput [matDatepicker]="datepicker" [value]="field.value"
        [placeholder]="field.label" [formControlName]="field.name" [disabled]="field.readonly || readOnlyPage"
        (blur)="onBlur()" (focus)="onFocus()" (dateChange)="updateValue()" [style.padding]="'4px'"
        [style.border-radius]="'4px'" [style.background-color]="field.style.background_color"
        [style.text-decoration]="field.style.text_decoration" [style.color]="field.style.font_color">
    <mat-datepicker-toggle matSuffix [for]="datepicker"></mat-datepicker-toggle>
    <mat-datepicker matInput [matDatepicker]="datepicker" #datepicker></mat-datepicker>

    <span *ngIf="field.suffix" matSuffix>{{field.suffix}}</span>
    <ng-container *ngFor="let validation of field.validations;" ngProjectAs="mat-error">
        <mat-error *ngIf="group.get(field.name).hasError(validation.name)">{{validation.message}}</mat-error>
    </ng-container>
</mat-form-field>

<mat-form-field [ngClass]="field.eventTrigger === 'press' ? 'readOnlyPressable': ''"
    [ngClass]="(field.readonly || readOnlyPage)? 'readOnly': 'notReadOnly'" (click)="onPress()"
    *ngIf="field.isVisible != false && (field.inputType === 'datetime')" [ngStyle]="{'width': '100%'}"
    appearance="outline" [formGroup]="group">
    <mat-label>{{field.label}}</mat-label>
    <span *ngIf="field.prefix" matPrefix>{{field.prefix}}</span>

    <input [required]="isRequired" matInput [ngxMatDatetimePicker]="datetimepicker" [placeholder]="field.label"
        [formControlName]="field.name" [disabled]="field.readonly || readOnlyPage" (blur)="onBlur()" (focus)="onFocus()"
        (dateChange)="updateValue()" [style.padding]="'4px'" [style.border-radius]="'4px'"
        [style.background-color]="field.style.background_color" [style.color]="field.style.font_color">
    <mat-datepicker-toggle matSuffix [for]="datetimepicker"></mat-datepicker-toggle>
    <ngx-mat-datetime-picker #datetimepicker [showSpinners]="true" [showSeconds]="true" [stepHour]="true"
        [stepMinute]="true" [stepSecond]="true" [touchUi]="false" [enableMeridian]="true" [disableMinute]="false"
        [hideTime]="false">
    </ngx-mat-datetime-picker>

    <span *ngIf="field.suffix" matSuffix>{{field.suffix}}</span>
    <ng-container *ngFor="let validation of field.validations;" ngProjectAs="mat-error">
        <mat-error *ngIf="group.get(field.name).hasError(validation.name)">{{validation.message}}</mat-error>
    </ng-container>
</mat-form-field>

<mat-form-field 
    [ngClass]="field.eventTrigger === 'press' && (field.readonly || readOnlyPage)? 'readOnlyPressable': 'notReadOnly'"
    (click)="onPress()" *ngIf="field.isVisible != false && (field.inputType === 'time')" [ngStyle]="{'width': '100%'}"
    appearance="outline" [formGroup]="group">
    <mat-label>{{field.label}}</mat-label>
    <span *ngIf="field.prefix" matPrefix>{{field.prefix}}</span>

    <input [required]="isRequired" matInput [ngxMatTimePicker]="timepicker" [placeholder]="field.label"
        [formControlName]="field.name" [disabled]="field.readonly || readOnlyPage" (blur)="onBlur()" (focus)="onFocus()"
        (dateChange)="updateValue()" [style.padding]="'4px'" [style.border-radius]="'4px'"
        [style.background-color]="field.style.background_color" [style.color]="field.style.font_color">
    <mat-datepicker-toggle matSuffix [for]="timepicker"></mat-datepicker-toggle>
    <ngx-mat-timepicker [required]="isRequired" [placeholder]="field.label" [formControlName]="field.name"
        [disabled]="field.readonly || readOnlyPage" (blur)="onBlur()" (focus)="onFocus()" (timeChange)="updateValue()"
        [style.padding]="'4px'" [style.border-radius]="'4px'" [style.background-color]="field.style.background_color"
        [style.color]="field.style.font_color">
    </ngx-mat-timepicker>

    <span *ngIf="field.suffix" matSuffix>{{field.suffix}}</span>
    <ng-container *ngFor="let validation of field.validations;" ngProjectAs="mat-error">
        <mat-error *ngIf="group.get(field.name).hasError(validation.name)">{{validation.message}}</mat-error>
    </ng-container>
</mat-form-field>
