<div class="full-width homepage-tab-component">
    <div style="width: 100%;">
        <mat-card *ngIf="isLoading"
            style="display: flex; justify-content: center; align-items: center">
            <mat-progress-spinner color="primary" mode="indeterminate">
            </mat-progress-spinner>
        </mat-card>

        <toolbar-elements *ngIf="!isLoading" [toolbar_elements]="toolbar_elements"></toolbar-elements>

        <div *ngIf="!isLoading && tiles && tiles.length" style="display: flex; flex-direction: row; height: 332px; background-color: #fafafa; justify-content: center;">
            <mat-card *ngFor="let tile of tiles; let i = index" class="homepage-tab-card">
                <mat-card-header>
                  <mat-card-title>{{tile.title}}</mat-card-title>
                  <mat-card-subtitle></mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                  <p class="homepage-tab-card-value" [ngStyle]="{'color': tile.content.color || 'black'}">
                    {{tile.content.value}}
                  </p>
                </mat-card-content>
               
              </mat-card>
        </div>
    </div>
</div>
