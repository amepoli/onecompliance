<div class="full-width">
    {{calendarDays[0][0]}}
    <ng-container *ngIf="isLoading || !calendarDays || !calendarDays.length" style="display: flex; justify-content: center; align-items: center; background-color: #fafafa;">
        <div align="center" style="margin-top: 25vh">
            <mat-progress-spinner color="primary" mode="indeterminate" class="mfa-spinner">
            </mat-progress-spinner>
        </div>
    </ng-container>

    <ng-container *ngIf="!isLoading && calendarDays && calendarDays.length > 0">
        <div class="calendar-component" >
            <div style="display: flex;">
                <div style="flex: 1; text-align: center;">
                    <button mat-raised-button color="primary" (click)="goToToday()"> Today</button>
                </div>
                <div style="flex: 1; text-align: center; color: darkcyan; font-size: 2em; font-weight: 500;">
                    <button mat-raised-button color="secondary" (click)="goToPreviousMonth()"> < Back</button>
                    {{curDate}}
                    <button mat-raised-button color="secondary" (click)="goToNextMonth()"> Next > </button>
                </div>
                <div style="flex: 1;"></div>
            </div>

            <div class="full-width calendar-flex-row" style="margin-top: 16px;">
                <ng-container *ngFor="let dayOfWeek of daysOfWeek">
                    <div class="days-header-element"><strong>{{dayOfWeek}}</strong></div>
                </ng-container>
            </div>

            <ng-container *ngFor="let row of calendarDays; let w = index">
                <div class="calendar-flex-row">
                    <ng-container *ngFor="let day of row; let d = index">
                        <ng-container *ngIf="day">
                            <div [ngClass]="'day-of-week-base ' + (day.selected? 'day-of-week-selected': day.today? 'day-of-week-today': 'day-of-week-not-selected')" (click)="loadDayEvents(d, day.day, w)"><strong>{{day.day}}</strong></div>
                        </ng-container>
                        <ng-container *ngIf="!day">
                            <div class="day-of-week-base"></div>
                        </ng-container>
                    </ng-container>
                </div>
                <ng-container *ngIf="selectedDay && selectedDay.week == w">
                    <div class="event-panel" [style.height.px]="(selectedDay.events.length * 32)">
                        <ng-container *ngFor="let event of selectedDay.events">
                            <div class="event-item">
                                <i class="event-dot" [style.background-color]="event.event_color"></i>
                                <p class="event-title">{{event.titolo}}</p>
                                <mat-icon class="event-open-link" (click)="showDayEvent(event)">event</mat-icon>
                            </div>
                        </ng-container>
                    </div>
                </ng-container>
            </ng-container>
        </div>
    </ng-container>

</div>
