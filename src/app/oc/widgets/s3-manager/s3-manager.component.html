<ng-container *ngIf="isLoading" class="s3-manager-loading-content">
    <mat-progress-spinner color="primary" mode="indeterminate" class="s3-manager-spinner">
    </mat-progress-spinner>
</ng-container>

<ng-container *ngIf="!isLoading">
    <ng-container *ngIf="curViewType === viewTypeTiles">
        <div class="s3-manager-folders-content">
            <ng-container *ngFor="let folder of folders">
                <div class="s3-manager-folder-info" (dblclick)="gotoFolder(folder)">
                    <i><mat-icon class="s3-manager-folder-icon" >folder</mat-icon></i>
                    <p class="s3-manager-folder-text">{{folder}}</p>
                </div>
            </ng-container>
            <ng-container *ngFor="let file of files">
                <div class="s3-manager-folder-info">
                    <i><mat-icon class="s3-manager-file-icon" >description</mat-icon></i>
                    <p class="s3-manager-file-text">{{file}}</p>
                </div>
            </ng-container>
        </div>            
    </ng-container>

</ng-container>
