<ng-container>
    <button mat-button [matMenuTriggerFor]="companyMenu" [ocTooltip]="tooltip">
        <mat-icon>share</mat-icon>
    </button>
    
    <mat-menu #companyMenu="matMenu">
        <ng-container *ngFor="let item of userCompanies">
            <button mat-menu-item (click)="performClick(item)">{{item}}</button>
        </ng-container>
    </mat-menu>
</ng-container>
