
<div mat-dialog-content>
    <div class="quickadd-header ">
        <h2>{{data.title | octranslate}}</h2>
        <div></div>
        <button mat-button (click)="closeDialog()">
            <mat-icon>cancel</mat-icon>
        </button>
    </div>
    <hr/>
    <div style="max-height: 700px; overflow: auto;">
        <form-view [isQuickAdd]="true" class="quick-add"
            [tableData]="data.quickAddFormParams" (sendEvent)='onEvent($event)'>
        </form-view>
    </div>
</div>
