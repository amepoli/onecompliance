<div class="file-drop-area">
  <span class="fake-btn">Choose file</span>
  <span class="file-msg">
    <ng-container *ngIf="files && files.length">
      <p *ngFor="let file of files">
        {{file.name}}
      </p>
    </ng-container>
    <ng-container *ngIf="!files || !files.length">
      <span>or drag and drop file(s) here</span>
    </ng-container>
  </span>
  <input type="file" id="fileInput" #fileInput class="file-input" (change)="emitFiles($event.target.files)" multiple>

</div>
<app-progress [progress]="progress"></app-progress>
