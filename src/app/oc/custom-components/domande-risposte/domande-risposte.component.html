<div class="full-width domande-component">
    <div style="margin-top: 8px; width: 100%;">
        <ng-container *ngIf="!isLoading">
            <div *ngFor="let fields of formData; trackBy:trackItems; let i = index">
                    <hr *ngIf="i >= 1">
                    <ng-container *ngIf="!data[i].isHidden">
                        <domanda-risposta class="form-container" [isQuickAdd]="false" [fields]='fields'
                            [readOnlyPage]='false'>
                        </domanda-risposta>
                    </ng-container>
            </div>
        </ng-container>
        
        <ng-container *ngIf="isLoading">
            <mat-card style="display: flex; justify-content: center; align-items: center; background-color: transparent; height: 256px;">
                <mat-progress-spinner color="primary" mode="indeterminate">
                </mat-progress-spinner>
            </mat-card>
        </ng-container>
    </div>
</div>
