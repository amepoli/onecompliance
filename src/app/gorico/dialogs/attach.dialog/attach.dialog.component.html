
<div mat-dialog-content>

    <file-manager *ngIf="!attach"></file-manager>

    <div id="forms" class="page-layout simple fullwidth" fxLayout="column">

        <!-- CONTENT -->
        <div class="content p-24">

            <div class="mb-24" fxLayout="column" fxLayoutAlign="center" fxLayout.gt-md="row">

                

                <!-- REACTIVE FORM (taken from https://github.com/nikapov/fuse-angular/blob/master/src/app/main/ui/forms/forms.component.html) -->

                <form *ngIf="attach" class="mat-card mat-elevation-z4 p-24 mr-24" fxLayout="column" fxLayoutAlign="center"
                    fxFlex="1 0 auto" name="form" [formGroup]="form" (ngSubmit)="onSave()" id="formAttach">

                    <div class="h2 mb-24">Allega file</div>

                    <app-file-upload formControlName="image" [progress]="progress"></app-file-upload>
             
                    <br><br>

                    <div fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field appearance="outline" fxFlex="100">
                            <mat-label>ID</mat-label>
                            <input matInput formControlName="id">
                            <mat-icon matSuffix class="disabled-text">domain</mat-icon>
                        </mat-form-field>

                    </div>

                    <div fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field appearance="outline" class="w-75-p">
                            <mat-label>Nome file</mat-label>
                            <input matInput formControlName="nomeFile" required>
                            <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                            <mat-error>Nome file obbligatorio!</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="w-25-p">
                            <mat-label>Dimensione</mat-label>
                            <input matInput formControlName="dimensione" required>
                            <mat-icon matSuffix class="disabled-text">account_circle</mat-icon>
                        </mat-form-field>

                    </div>

                    <div fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>URL documento</mat-label>
                            <input matInput formControlName="docURL">
                            <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                        </mat-form-field>

                    </div>

                    <div fxLayout="row wrap" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Descrizione breve</mat-label>
                            <textarea matInput formControlName="descBreve">
                        </textarea>
                        </mat-form-field>
                    </div>

                    <div fxLayout="row wrap" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Descrizione</mat-label>
                            <textarea matInput formControlName="descrizione"></textarea>
                        </mat-form-field>

                    </div>

                    <div fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Tipo documento</mat-label>
                            <mat-select formControlName="tipo" required>
                                <mat-option [value]="'Rendiconto'">
                                    Rendiconto
                                </mat-option>
                            </mat-select>
                            <mat-icon matSuffix class="secondary-text">outlined_flag</mat-icon>
                        </mat-form-field>

                    </div>

                </form>

                <!-- / REACTIVE FORM EXAMPLE -->

            </div>
        </div>

    </div>

</div>

<div mat-dialog-actions>
    <button *ngIf="!attach" mat-button (click)="onAttach()">Allega Nuovo</button>
    <button *ngIf="attach" mat-button type="submit" form="formAttach">Salva</button>
    <button mat-button [mat-dialog-close]="" cdkFocusInitial>Chiudi</button>
</div>
