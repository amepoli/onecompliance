
<div mat-dialog-content>

    <file-manager *ngIf="!attach"></file-manager>

    <div id="forms" class="page-layout simple fullwidth" fxLayout="column">

        <!-- CONTENT -->
        <div class="center" fxFlex>

            <!-- HEADER -->
            <div *ngIf="attach" class="header mat-accent-bg p-24" fxLayout="column" fxLayoutAlign="space-between start">
            
                <div class="breadcrumb text-truncate h1 pl-64 w-100-p" fxLayout="row" fxLayoutAlign="space-between center">
                        <span>Allega Nuovo File</span>
                </div>
            </div>

            <div class="mb-24" fxLayout="column" fxLayoutAlign="center" fxLayout.gt-md="row">

                

                <!-- REACTIVE FORM (taken from https://github.com/nikapov/fuse-angular/blob/master/src/app/main/ui/forms/forms.component.html) -->

                <form class="mat-card mat-elevation-z4 p-24 mr-24" fxLayout="column" fxLayoutAlign="center"
                    fxFlex="1 0 auto" name="form" [formGroup]="form" (ngSubmit)="onSave()" id="formAttach">

                    <app-file-upload formControlName="fileContent" [progress]="progress" [hidden]="!attach" #fileUploader></app-file-upload>
             
                    <br><br>

                    <div *ngIf="attach" fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field appearance="outline" fxFlex="100">
                            <mat-label>ID</mat-label>
                            <input matInput formControlName="id">
                            <mat-icon matSuffix class="disabled-text">fingerprint</mat-icon>
                        </mat-form-field>

                    </div>

                    <div *ngIf="attach" fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field appearance="outline" class="w-75-p">
                            <mat-label>Nome file</mat-label>
                            <input matInput formControlName="fileName" required>
                            <mat-icon matSuffix class="secondary-text">local_offer</mat-icon>
                            <mat-error>Nome file obbligatorio!</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="w-25-p">
                            <mat-label>Dimensione</mat-label>
                            <input matInput formControlName="dimension" required>
                            <mat-icon matSuffix class="disabled-text">photo_size_select_small</mat-icon>
                        </mat-form-field>

                    </div>

                    <div *ngIf="attach" fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>URL documento</mat-label>
                            <input matInput formControlName="docURL">
                            <mat-icon matSuffix class="secondary-text">link</mat-icon>
                        </mat-form-field>

                    </div>

                    <div *ngIf="attach" fxLayout="row wrap" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Descrizione breve</mat-label>
                            <textarea matInput formControlName="shortDesc">
                        </textarea>
                        </mat-form-field>
                    </div>

                    <div *ngIf="attach" fxLayout="row wrap" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Descrizione</mat-label>
                            <textarea matInput formControlName="description"></textarea>
                        </mat-form-field>

                    </div>

                    <div *ngIf="attach" fxLayout="row" fxLayoutAlign="start center" fxFlex="1 0 auto">

                        <mat-form-field class="w-100-p" appearance="outline" fxFlex="100">
                            <mat-label>Tipo documento</mat-label>
                            <mat-select formControlName="type" required>
                                <mat-option [value]="'Rendiconto'">
                                    Rendiconto
                                </mat-option>
                            </mat-select>
                        </mat-form-field>

                    </div>

                </form>

                <form-view *ngIf="attach" [tableData]="newTypeParams" (sendEvent)='onNewType($event)'></form-view>

                <!-- / REACTIVE FORM EXAMPLE -->

            </div>
        </div>

    </div>

</div>

<div mat-dialog-actions>
    <button *ngIf="attach" mat-button type="submit" form="formAttach">Salva</button>
    <button mat-button [mat-dialog-close]="" cdkFocusInitial>Chiudi</button>
</div>
