<div class="full-width" #List [ngStyle]="{height: (formHeight) + 'px'}">

    <div class="main-table-headers">
        <div class="navi-bar">
            <ng-container *ngFor='let item of navigationHistory'>
                <mat-icon>arrow_forward</mat-icon>
                <a href="javascript: void(0)" (click)='historyPop(item)'>{{item.description}}</a>
            </ng-container>
            <ng-container *ngIf='navigationHistory.length > 0'>
                <mat-icon>arrow_forward</mat-icon>
                <p>{{currentDescription}}</p>
            </ng-container>
        </div>

        <form-view-toolbar *ngIf="formView && tableType=='form' && !fullScreenTab" class="form-view-toolbar"
            [formView]="formView">
        </form-view-toolbar>
    </div>

    <div class="main-table-content"
        [ngStyle]="{'margin-top': navigationHistory.length > 0? tableType=='form' && !fullScreenTab? '111px': '47px': '0px'}">
        <table-view *ngIf="tableType=='table'" [tableData]="tableParams" (sendEvent)='onEvent($event)' class=""
            [ngStyle]="{'margin-top': navigationHistory != null && navigationHistory.length > 0? '47px': '0px'}">
        </table-view>

        <form-view #formView *ngIf="tableType=='form' && !fullScreenTab" [tableData]="formParams"
            (sendEvent)='onEvent($event)'
            [ngStyle]="{'margin-top': navigationHistory != null && navigationHistory.length > 0? '47px': '0px'}">
        </form-view>

        <bottom-tabs *ngIf="tableType=='form' && showTabs" [Tabs]='tabs' [SaveData]='tabsSaveData'
            (sendEvent)='onEvent($event)' #Tabs>
        </bottom-tabs>

    </div>


    <br>
    <hr>
    <br>
    <!-- 
    <ng-container class="scrolling-element">

    </ng-container> -->

</div>
