<div class="full-width" #List>

    <table-view *ngIf="loadTable && !singleRecord" [tableData]="tableParams" (sendEvent)='onEvent($event)'></table-view>

    <form-view *ngIf="singleRecord && !fullScreenTab" [tableData]="formParams" (sendEvent)='onEvent($event)'>
    </form-view>

    <ng-container *ngIf="singleRecord && showTabs">
        <br><br>
        <hr>

        <bottom-tabs [Tabs]='tabs' (sendEvent)='onEvent($event)'></bottom-tabs>
    </ng-container>

</div>
