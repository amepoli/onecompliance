<mat-tab-group (selectedTabChange)="tabChanged($event)">
    <mat-tab *ngFor='let tab of Tabs; let idx = index' [label]="tab.label" >
        <ng-container *ngIf="activeIndex === idx" >
            <table-view *ngIf="tab.type === 'table'" [tableData]='tableParams' (sendEvent)='onEvent($event)'></table-view>
            <form-table-view *ngIf="tab.type === 'tableForm'" [tableData]='formTableParams' [SaveData]='tableFormSave' (sendEvent)='onEvent($event)'></form-table-view>
        </ng-container>
    </mat-tab>
  </mat-tab-group>
