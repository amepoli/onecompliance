<mat-tab-group #tabsGroup (selectedTabChange)="tabChanged($event)" class="full-width">
    <mat-tab *ngFor='let tab of filteredTabs; let idx = index' [label]="tab.label">
        <ng-container *ngIf="activeIndex === idx">
            <table-view *ngIf="tab.type === 'table'" [isTabMode]="true" [isCurTab]="activeIndex === idx? true: false"
                [tableData]='tableParams' (sendEvent)='onEvent($event)' (onReload)="reload()">
            </table-view>
            <form-table-view *ngIf="tab.type === 'tableForm'" [isTabMode]="true"
                [isCurTab]="activeIndex === idx? true: false" [tableData]='formTableParams' [SaveData]='tableFormSave'
                (sendEvent)='onEvent($event)' (onReload)="reload()">
            </form-table-view>
        </ng-container>
    </mat-tab>
</mat-tab-group>
