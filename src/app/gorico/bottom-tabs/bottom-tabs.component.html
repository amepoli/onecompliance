<mat-tab-group>
    <mat-tab *ngFor='let tab of Tabs;' [label]="tab.label" >
        <ng-container *ngIf="tab.name === 'organigramma'" >
            <mngt-units [sub_keys]='tab.keys'></mngt-units>
        </ng-container>
        <ng-container *ngIf="tab.name === 'procedure'" >
            <processes [sub_keys]='tab.keys'></processes>
        </ng-container>
    </mat-tab>
  </mat-tab-group>
