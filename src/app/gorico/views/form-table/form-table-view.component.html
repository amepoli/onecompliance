<div class="full-width">
    <div style="display: flex;">
        <mat-form-field style="padding-left: 8px;">
            <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
        </mat-form-field>
        <div style="flex-grow: 1"></div>
        <button mat-button (click)="reload()">
            <mat-icon>refresh</mat-icon>
            Reload
        </button>
        <button mat-button (click)="saveChanges()">
            <mat-icon>save</mat-icon>
            Save
        </button>
        <button mat-button (click)="addNew()">
            <mat-icon>add</mat-icon>
            Nuovo
        </button>
        <button mat-button (click)="fullScreen()">
            <mat-icon *ngIf="!isFullScreen">fullscreen</mat-icon>
            <mat-icon *ngIf="isFullScreen">fullscreen_exit</mat-icon>
            FullScreen
        </button>





    </div>
    <button *ngIf="(tableData.showHeader && !showQuickAdd) || (!tableData.showHeader && isFullScreen && !showQuickAdd)"
        mat-button (click)="quickAdd()">
        <mat-icon>add</mat-icon>
        Quick Add
    </button>
    <form-view *ngIf="showQuickAdd" class="adv-search" [tableData]="quickAddFormParams" (sendEvent)='onEvent($event)'>
    </form-view>

    <form-getter [filter]="filter" [formParams]='getterParams' (onReload)="reload()">
    </form-getter>
</div>
