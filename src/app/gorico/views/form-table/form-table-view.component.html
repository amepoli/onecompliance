<div class="full-width">
    <button mat-button (click)="fullScreen()" class="form-table-view-button">
        <mat-icon *ngIf="!isFullScreen">fullscreen</mat-icon>
        <mat-icon *ngIf="isFullScreen">fullscreen_exit</mat-icon>
        FullScreen
    </button>
    <button mat-button (click)="addNew()" class="form-table-view-button">
        <mat-icon>add</mat-icon>
        Nuovo
    </button>
    <form-getter [formParams]='getterParams' class="form-table-view-content"
        [ngClass]="isFullScreen? 'full-mode': 'split-mode'"></form-getter>
</div>
