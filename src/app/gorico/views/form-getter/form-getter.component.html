<div class='full-width'>
    <dynamic-form *ngIf="formParams.isVisible && !isLoading" class="form-container" [fields]='formData'>
    </dynamic-form>

    <mat-card *ngIf="formParams.isVisible && isLoading" style="display: flex; justify-content: center; align-items: center">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
    </mat-card>

</div>
