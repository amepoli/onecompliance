<div class='full-width'>
    <div *ngFor="let item of filteredFormData; let idx=index">
        <hr><br>
        <dynamic-form
            *ngIf="formParams.isVisible && !isLoading && (hiddenRows[idx] == null || hiddenRows[idx] === false)"
            class="form-container" [fields]='item' [readOnlyPage]='readonlyRows[idx]'>
        </dynamic-form>
    </div>
    <mat-card *ngIf="formParams.isVisible && isLoading"
        style="display: flex; justify-content: center; align-items: center">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
    </mat-card>

</div>
